# SkillSpector baseline for this library.
#
# CI scans every skill with `--fail-on-findings --baseline .skillspector-baseline.yaml`,
# so any active finding that is not listed here fails the "Skill checks" workflow.
# Add a rule only after reviewing the finding; `reason` is required and should say
# why the finding is a false positive or an accepted risk.
#
# Rule paths are relative to each scanned skill folder (e.g. references/x.md).
# Prefer narrow rules (id + path + message) over global ones, and remove a rule
# when the underlying text changes. Reference: https://github.com/NVIDIA/SkillSpector/blob/main/docs/SUPPRESSION.md

version: 2

rules:
  - id: "RA2"
    path: "references/execution.md"
    message: "*Read the saved state*"
    reason: >-
      False positive (reviewed 2026-11-23): "Read the saved state" is post-write
      readback of the user's tracker items, not a persistence mechanism. The skill
      creates no cron jobs, startup scripts, or cross-session state.

  - id: "TM1"
    path: "references/github.md"
    message: "*DELETE*sub_issue*"
    reason: >-
      False positive (reviewed 2026-11-23, flagged by SkillSpector 2.13.4 inside
      SkillEvaluator 1.0.1): the line documents GitHub's REST endpoint for removing
      a sub-issue. The skill requires explicit authorization and readback before any
      tracker mutation; it does not instruct unattended deletion.

  - id: "MP3"
    path: "*references/feature-map-example/README.md"
    message: "*clear state*"
    reason: >-
      False positive (reviewed 2026-11-24): pstack's example feature map says its
      search feature "covers ... matching, empty, and clear states", meaning UI
      states of a search box. Nothing in the example clears or rewrites agent
      memory. Covers create-verification-skill and the copy bundled in
      maintain-verification-skill.

  - id: "MP3"
    path: "references/upstream/ORIGINAL-SKILL.md"
    message: "*delete history*"
    reason: >-
      False positive (reviewed 2026-11-24): show-me-your-work's rule reads
      "Append-only. A wrong call gets a new row that supersedes it. Never edit or
      delete history." It forbids deleting the decision log; it does not
      manipulate agent memory.

  # impeccable 4.0.3 reference playbooks (pbakaus/impeccable, tag skill-v4.0.3),
  # reviewed 2026-11-24. Each line was read in context; none instructs the agent
  # to act without consent.
  - id: "MP3"
    path: "references/upstream/reference/colorize.md"
    message: "*new identity is*"
    reason: >-
      False positive: "If a new identity is required, use new-work.md" refers to a
      new brand identity, not the agent's identity.
  - id: "AR2"
    path: "references/upstream/reference/degraded/*.md"
    message: "*without warning*"
    reason: >-
      False positive: "a hard turn ceiling that ends the run without warning"
      describes a time limit on a sub-task; it does not suppress refusals.
  - id: "EA2"
    path: "references/upstream/reference/audit*.md"
    message: "*without verification*"
    reason: >-
      False positive: listed under things not to do ("Report false positives
      without verification").
  - id: "EA2"
    path: "references/upstream/reference/critique.md"
    message: "*No confirmation*"
    reason: >-
      False positive: "No confirmation that an action succeeded" is a UX
      anti-pattern the critique looks for in the user's interface.
  - id: "EA2"
    path: "references/upstream/reference/degraded/finish-reviewer.md"
    message: "*without approval*"
    reason: >-
      False positive: "added without approval" is a review label for design
      elements a build added that the approved comp did not contain.
  - id: "EA2"
    path: "references/upstream/reference/delight.md"
    message: "*without consent*"
    reason: >-
      False positive: listed as something delight features must not do ("play
      sound without consent or ignore mute settings").
  - id: "EA2"
    path: "references/upstream/reference/document.md"
    message: "*without asking*"
    reason: >-
      False positive: a safeguard, "Don't overwrite an existing DESIGN.md without
      asking."
  - id: "EA2"
    path: "references/upstream/reference/visualize.md"
    message: "*without asking*"
    reason: >-
      False positive: a prohibition, "Do not substitute a different visual driver
      after approval without asking."
  - id: "EA3"
    path: "LICENSE.txt"
    message: "*not limited to*"
    reason: >-
      False positive: standard Apache License 2.0 wording.
