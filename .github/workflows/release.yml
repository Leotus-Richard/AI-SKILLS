name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# Runs on the self-hosted ARM64 Linux runners; see validate.yml for the label override.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Validate and package
    runs-on: ${{ fromJSON(vars.SELF_HOSTED_RUNNER_LABELS || '["self-hosted","linux","ARM64","ai-skills"]') }}
    env:
      DISABLE_TELEMETRY: '1'
      DO_NOT_TRACK: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26.13.1'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version in package.json ($version). Bump the version in a pull request, then tag that commit."
            exit 1
          fi
      - name: Validate skills and registry
        run: npm run validate
      - name: Check generated catalog
        run: npm run catalog:check
      - name: Run tests
        run: npm test
      - name: Build upload packages
        run: npm run build
      # A manual run keeps the built packages as a workflow artifact for review.
      # A tagged release attaches nothing: GitHub adds the source archives itself.
      - name: Upload built packages for review
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: ai-skills-release
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish tagged release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ${{ fromJSON(vars.SELF_HOSTED_RUNNER_LABELS || '["self-hosted","linux","ARM64","ai-skills"]') }}
    permissions:
      contents: write
    steps:
      - name: Check GitHub CLI on the runner
        run: |
          command -v gh >/dev/null || { echo '::error::Install the GitHub CLI (gh) on the self-hosted runner to publish releases.'; exit 1; }
      # Source only: the release is the tag, its notes, and the source archives
      # GitHub attaches to every release. No built file is uploaded.
      - name: Publish the tagged release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --repo "$RELEASE_REPOSITORY" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --generate-notes
