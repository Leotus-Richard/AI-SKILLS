name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      DISABLE_TELEMETRY: '1'
      DO_NOT_TRACK: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate skills and registry
        run: npm run validate
      - name: Check generated catalog
        run: npm run catalog:check
      - name: Run tests
        run: npm test
      - name: Build upload packages
        run: npm run build
      - name: Upload validated packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ai-skills-validation
          path: dist/
          if-no-files-found: error
          retention-days: 14
