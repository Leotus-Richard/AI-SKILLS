name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Linux runs on the self-hosted ARM64 Linux runners. Override the labels with the
# repository variable SELF_HOSTED_RUNNER_LABELS (a JSON array) if yours differ.
#
# Self-hosted runners only run trusted code: pushes, manual runs, and pull
# requests from branches in this repository. Pull requests from forks run the
# Linux leg on a GitHub-hosted runner instead, so outside code never executes
# on your machines.
jobs:
  linux-self-hosted:
    name: Validate (linux, self-hosted)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/node-checks.yml
    with:
      runs-on: ${{ vars.SELF_HOSTED_RUNNER_LABELS || '["self-hosted","linux","ARM64","ai-skills"]' }}
      upload-artifact: ai-skills-validation

  # Keeps the documented minimum (package.json engines) honest.
  linux-min-node:
    name: Validate (linux, minimum Node)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/node-checks.yml
    with:
      runs-on: ${{ vars.SELF_HOSTED_RUNNER_LABELS || '["self-hosted","linux","ARM64","ai-skills"]' }}
      node-version: '22.20.0'

  linux-fork:
    name: Validate (linux, fork PR)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    uses: ./.github/workflows/node-checks.yml
    with:
      runs-on: '"ubuntu-latest"'

  cross-platform:
    name: Validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    uses: ./.github/workflows/node-checks.yml
    with:
      runs-on: ${{ format('"{0}"', matrix.os) }}

  # Blocks a PR that changes a skill without bumping metadata.version and
  # recording its expected behavior. Rules: docs/VERSIONING.md.
  versions:
    name: Skill versions
    if: github.event_name == 'pull_request'
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.full_name == github.repository && (vars.SELF_HOSTED_RUNNER_LABELS || '["self-hosted","linux","ARM64","ai-skills"]') || '"ubuntu-latest"') }}
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26.13.1'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Require a version bump for each changed skill
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        # Default `bash -e` has no pipefail; without it tee would hide a failure.
        run: |
          set -o pipefail
          node scripts/check-versions.mjs --base "$BASE_SHA" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
