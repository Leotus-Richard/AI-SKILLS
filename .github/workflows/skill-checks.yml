name: Skill checks

# Keyless static gates for every skill change, on the self-hosted Ubuntu runners:
#   - SkillSpector: security scan of each skill. Blocks on any active finding
#     not accepted in .skillspector-baseline.yaml.
#   - SkillEvaluator Tier 1: quality score, schema, harness compatibility, PII,
#     license, Unicode, secrets and code checks from NVIDIA's pinned image.
#     Advisory until the repository variable SKILL_TIER1_ENFORCE is 'true'.
#
# Live agent evaluation (Tier 2/3) needs a model key and lives in skill-eval.yml.
# See docs/SKILL-EVALUATION.md.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      scan-mode:
        description: Tier 1 scope (changed skills only, or all)
        type: choice
        options: [all, changed]
        default: all

permissions:
  contents: read

concurrency:
  group: skill-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pins from SkillEvaluator's reviewed CI bundle 1.2.0 (ci/bundles/1.2.0/release.json).
  TIER1_IMAGE: ghcr.io/nvidia/skillevaluator-tier1@sha256:39c381bc9559be4fe30ede2b937d1a8577fcfedc66230a8e52b6fe5e79c23c94
  # SkillSpector v2.13.6.
  SKILLSPECTOR_REF: e2674da339b0bddc6e565d059c0577c6d9cd25da
  DO_NOT_TRACK: '1'

jobs:
  skillspector:
    name: SkillSpector security scan
    # Self-hosted runners run trusted code only. Fork PRs need a maintainer to
    # review the change and run this workflow manually from a branch.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(vars.SELF_HOSTED_RUNNER_LABELS || '["self-hosted","linux","x64"]') }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install SkillSpector
        run: |
          python -m venv "$RUNNER_TEMP/skillspector-venv"
          "$RUNNER_TEMP/skillspector-venv/bin/pip" install --quiet --disable-pip-version-check \
            "skillspector @ git+https://github.com/NVIDIA/SkillSpector.git@${SKILLSPECTOR_REF}"
          echo "$RUNNER_TEMP/skillspector-venv/bin" >> "$GITHUB_PATH"
      - name: Scan each skill
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/skillspector-reports"
          mkdir -p "$out"
          status=0
          for dir in skills/*/; do
            name="$(basename "$dir")"
            [ -f "$dir/SKILL.md" ] || continue
            skillspector scan "$dir" --no-llm --fail-on-findings \
              --baseline .skillspector-baseline.yaml \
              --format json --output "$out/$name.json"
            rc=$?
            echo "$name exit=$rc"
            if [ "$rc" -ne 0 ]; then
              status=1
              echo "::error title=SkillSpector::$name has active findings or the scan failed (exit $rc). Fix them or add a reviewed rule to .skillspector-baseline.yaml."
            fi
          done
          exit "$status"
      - name: Summarize findings
        if: always()
        run: |
          python3 -I - "$RUNNER_TEMP/skillspector-reports" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, pathlib, sys
          rows, details = [], []
          for path in sorted(pathlib.Path(sys.argv[1]).glob("*.json")):
              data = json.loads(path.read_text())
              risk = data.get("risk_assessment") or {}
              issues = data.get("issues") or []
              done = (data.get("analysis_completeness") or {}).get("status", "?")
              rows.append(f"| {path.stem} | {risk.get('recommendation', '?')} | {len(issues)} | {data.get('suppressed_count', 0)} | {done} |")
              for issue in issues:
                  loc = issue.get("location") or {}
                  details.append(f"- **{path.stem}** `{issue.get('id')}` {issue.get('severity')} {issue.get('category')}/{issue.get('pattern')} at `{loc.get('file')}:{loc.get('start_line')}`: {issue.get('remediation', '')}")
          print("## SkillSpector\n")
          print("| Skill | Recommendation | Active findings | Suppressed | Coverage |\n| --- | --- | --- | --- | --- |")
          print("\n".join(rows) or "| (no reports) | | | | |")
          if details:
              print("\n### Active findings\n")
              print("\n".join(details))
          PY
      - name: Upload SkillSpector reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skillspector-reports
          path: ${{ runner.temp }}/skillspector-reports/
          if-no-files-found: warn
          retention-days: 14

  tier1:
    name: SkillEvaluator Tier 1
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(vars.SELF_HOSTED_RUNNER_LABELS || '["self-hosted","linux","x64"]') }}
    timeout-minutes: 60
    env:
      SCAN_MODE: ${{ github.event_name == 'pull_request' && 'changed' || inputs.scan-mode || 'all' }}
      ENFORCE: ${{ vars.SKILL_TIER1_ENFORCE == 'true' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Changed-skill mode needs history to find the merge base.
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 1 }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check Docker on the runner
        run: |
          docker info --format 'Docker {{.ServerVersion}}' || {
            echo '::error::Docker is not usable by the runner user. Install Docker and add the runner user to the docker group.'
            exit 1
          }
      - name: Pull the pinned image without registry credentials
        run: |
          mkdir -p "$RUNNER_TEMP/anonymous-docker-config"
          docker --config "$RUNNER_TEMP/anonymous-docker-config" pull "$TIER1_IMAGE"
      - name: Evaluate skills
        id: evaluate
        continue-on-error: ${{ vars.SKILL_TIER1_ENFORCE != 'true' }}
        env:
          SKILL_PATHS: skills
          MIN_SCORE: ${{ vars.SKILL_MIN_SCORE || '70' }}
          LLM_ENABLED: 'false'
          SCAN_WORKERS: '4'
          SECURITY_BASELINES: 'false'
          DIFF_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DIFF_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          POLICY_SOURCE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          CALLER_WORKFLOW_SHA: ${{ github.workflow_sha }}
          REPORT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPORT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/skill-reports"
          export REPORT_IMAGE="$TIER1_IMAGE" REPORT_URL=""
          # Same hardened invocation as NVIDIA's reusable evaluate-skills.yml:
          # read-only workspace, no capabilities, no privilege escalation.
          docker run --rm --user "$(id -u):$(id -g)" \
            --read-only --tmpfs /tmp:rw,nosuid,noexec,size=1g \
            --tmpfs /audit-tmp:rw,nosuid,noexec,mode=1777,size=1g --env TMPDIR=/audit-tmp \
            --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/skill-reports,dst=/reports" \
            --env SKILL_PATHS --env MIN_SCORE --env LLM_ENABLED \
            --env SCAN_MODE --env DIFF_BASE_SHA --env DIFF_HEAD_SHA --env SCAN_WORKERS \
            --env SECURITY_BASELINES --env POLICY_SOURCE_SHA --env CALLER_WORKFLOW_SHA \
            --env GITHUB_ACTIONS --env REPORT_IMAGE --env REPORT_URL --env REPORT_RUN_URL --env REPORT_COMMIT \
            "$TIER1_IMAGE"
      - name: Note advisory result
        if: steps.evaluate.outcome == 'failure' && env.ENFORCE != 'true'
        run: echo "::warning title=SkillEvaluator Tier 1::Not all skills passed Tier 1. This job is advisory; set the repository variable SKILL_TIER1_ENFORCE=true to make it blocking."
      - name: Add the result to the workflow summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/skill-reports/summary.md" ]; then
            cat "$RUNNER_TEMP/skill-reports/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Tier 1 did not complete. Inspect the failed step above.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload Tier 1 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skillevaluator-tier1-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/skill-reports/
          if-no-files-found: warn
          retention-days: 14
