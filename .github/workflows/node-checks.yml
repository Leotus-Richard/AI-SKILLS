name: Node checks (reusable)

# Shared validate/catalog/test/build steps. Callers pick the runner so the same
# steps run on self-hosted ARM64 Linux and on GitHub-hosted macOS/Windows.
on:
  workflow_call:
    inputs:
      runs-on:
        description: JSON runner spec, e.g. '["self-hosted","linux","ARM64","ai-skills"]' or '"windows-latest"'
        type: string
        required: true
      upload-artifact:
        description: Upload dist/ as an artifact with this name; empty skips the upload
        type: string
        default: ''
      node-version:
        description: Node.js version to test with (default is the current LTS)
        type: string
        default: '26.13.1'

permissions:
  contents: read

jobs:
  checks:
    name: Validate, test, build (Node ${{ inputs.node-version }})
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 30
    env:
      DISABLE_TELEMETRY: '1'
      DO_NOT_TRACK: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate skills and registry
        run: npm run validate
      - name: Check generated catalog
        run: npm run catalog:check
      - name: Run tests
        run: npm test
      - name: Build upload packages
        run: npm run build
      - name: Upload validated packages
        if: inputs.upload-artifact != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.upload-artifact }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
